[project]
name = "api"
version = "0.1.0"
description = "Calling an LLM API: system prompts, temperature, sturctured JSON output, cost and rate limits."
readme = "README.md"
authors = [
    { name = "naggynab", email = "080bct047.nabina@pcampus.edu.np" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
